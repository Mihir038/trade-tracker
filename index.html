<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html[data-theme=light]{--bg:#f6f7fb;--sf:#fff;--bd:#e2e5ee;--tx:#0f172a;--mu:#5a6478;--ac:#3730a3;--ac2:#eceefd;--pb:#3730a3;--g:#0b8a5c;--r:#c4283a;--a:#a8560a;--b:#2559c9;color-scheme:light}
html[data-theme=dark]{--bg:#0a0f1f;--sf:#111830;--bd:#222b49;--tx:#e8ecf8;--mu:#97a1bf;--ac:#a5acff;--ac2:#1b2352;--pb:#5256e0;--g:#34d399;--r:#fb7185;--a:#fbbf24;--b:#7cb4ff;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono,.kv,.num,input[type=number],td.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;flex:none}.mu{color:var(--mu)}.pos{color:var(--g)}.neg{color:var(--r)}
#side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--sf);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.brand{display:flex;gap:10px;align-items:center;font-weight:650;font-size:16px;padding:2px 8px 18px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--pb);color:#fff;display:grid;place-items:center}.logo .i{width:17px;height:17px}
#side a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500}
#side a:hover{background:var(--bg);color:var(--tx)}#side a.on{background:var(--ac2);color:var(--ac)}
#side .sp{flex:1}.top{display:none}
main{margin-left:236px;padding:28px 32px 56px}.wrap{max-width:1240px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em}h2{font-size:15px;font-weight:600;margin-bottom:12px}h3{font-size:14px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px}
.g{display:grid;gap:16px;margin-bottom:16px}.k6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:2fr 1fr}.g11{grid-template-columns:1fr 1fr}
.kpi .kv{font-size:24px;font-weight:600;margin:4px 0 2px;letter-spacing:-.02em}.ks{font-size:12px}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 14px;font:500 14px 'Geist';cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:background .15s}
.btn:hover{background:var(--bg)}.btn.pr{background:var(--pb);border-color:var(--pb);color:#fff}.btn.pr:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:13px}.btn.dg{color:var(--r)}.btn.on{background:var(--ac2);color:var(--ac);border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select,textarea{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:14px 'Geist';width:100%}
textarea{resize:vertical;min-height:70px}label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mu);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;color:var(--mu);font:500 13px 'Geist';cursor:pointer}.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 0 0 1px var(--bd)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tb>*{width:auto;flex:0 1 150px}.tb>.seg{flex:none}.tb .search{flex:1 1 220px;position:relative}.tb .search input{padding-left:34px}.tb .search .i{position:absolute;left:10px;top:9px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
th{color:var(--mu);text-align:left;padding:8px 10px;font-weight:500;font-size:12px;white-space:nowrap}td{padding:10px;border-top:1px solid var(--bd);vertical-align:middle}
.num{text-align:right}th.num{text-align:right}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--bg)}tr.clk.trade-win td,tr.clk.trade-win:hover td{background:color-mix(in srgb,var(--g) 9%,var(--sf))}tr.clk.trade-loss td,tr.clk.trade-loss:hover td{background:color-mix(in srgb,var(--r) 9%,var(--sf))}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--bd);color:var(--mu);margin:0 4px 2px 0;white-space:nowrap}.tag.neg{color:var(--r);border-color:currentColor}.tag.pos{color:var(--g);border-color:currentColor}
.journal-list{display:grid;gap:12px}.jtrade{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(230px,.8fr);background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}.jtrade.trade-win{border-color:color-mix(in srgb,var(--g) 35%,var(--bd))}.jtrade.trade-loss{border-color:color-mix(in srgb,var(--r) 35%,var(--bd))}.jtrade-main,.jtrade-learning{min-width:0;padding:16px}.jtrade.trade-win .jtrade-main{background:color-mix(in srgb,var(--g) 5%,var(--sf))}.jtrade.trade-loss .jtrade-main{background:color-mix(in srgb,var(--r) 5%,var(--sf))}.jtrade.trade-win .jtrade-stat{background:color-mix(in srgb,var(--g) 9%,var(--sf));border-color:color-mix(in srgb,var(--g) 20%,var(--bd))}.jtrade.trade-loss .jtrade-stat{background:color-mix(in srgb,var(--r) 9%,var(--sf));border-color:color-mix(in srgb,var(--r) 20%,var(--bd))}.jtrade-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.jtrade-open{min-width:0;border:0;padding:0;background:none;color:var(--tx);text-align:left;font:inherit;cursor:pointer}.jtrade-open:hover .jtrade-symbol{color:var(--ac)}.jtrade-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.jtrade-symbol{font-size:16px;font-weight:600}.jtrade-date{display:block;color:var(--mu);font-size:12px;margin-top:3px}.jtrade-actions{display:flex;gap:6px;flex:none}.jtrade-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px;margin:14px 0}.jtrade-stat{min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:9px}.jtrade-stat small{display:block;color:var(--mu);font-size:11px}.jtrade-stat b{display:block;margin-top:2px;overflow-wrap:anywhere;font-size:13px}.jtrade-discipline{display:flex;flex-wrap:wrap;gap:4px}.jtrade-discipline .tag{margin:0}.jtrade-learning{border-left:1px solid var(--bd);background:var(--bg)}.jtrade.trade-win .jtrade-learning{background:color-mix(in srgb,var(--g) 7%,var(--sf))}.jtrade.trade-loss .jtrade-learning{background:color-mix(in srgb,var(--r) 7%,var(--sf))}.jtrade-learning h3{margin-bottom:7px}.jtrade-learning p{color:var(--mu);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.jtrade-mistake{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}.jtrade-learning .jtrade-empty{font-style:italic}
.share-list{display:grid;gap:10px}.share-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px;border:1px solid var(--bd);border-radius:10px}.share-item-main{min-width:0;overflow-wrap:anywhere}.share-item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}.share-state{display:inline-block;margin-top:4px;font-size:12px;color:var(--mu)}.share-form{display:flex;align-items:flex-end;gap:10px;max-width:620px}.share-form label{flex:1}.share-note{font-size:12px;margin-top:8px}.shared-trades{display:grid;gap:12px}.shared-trade{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,.75fr);border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--sf)}.shared-trade-main,.shared-trade-learning{padding:16px;min-width:0}.shared-trade-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.shared-trade-title{font-size:16px;font-weight:600}.shared-trade-date{display:block;color:var(--mu);font-size:12px}.shared-trade-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:14px 0}.shared-trade-stat{min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:9px}.shared-trade-stat small{display:block;color:var(--mu);font-size:11px}.shared-trade-stat b{display:block;margin-top:2px;overflow-wrap:anywhere;font-size:13px}.shared-trade-learning{border-left:1px solid var(--bd);background:var(--bg)}.shared-trade-learning h3{font-size:13px;margin-bottom:6px}.shared-trade-learning p{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mu);font-size:13px}.shared-trade-learning h3:not(:first-child){margin-top:12px}
canvas.ch{width:100%;height:250px;display:block}.empty{color:var(--mu);padding:36px 12px;text-align:center}
#tip{position:fixed;pointer-events:none;background:var(--tx);color:var(--bg);padding:6px 10px;border-radius:8px;font:12px 'Geist Mono';z-index:30;line-height:1.5}
.dn{width:150px;height:150px;display:block;margin:0 auto 10px}.lrow{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
.rl{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}.rl:first-of-type{border-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{color:var(--mu);font-size:12px;text-align:center;padding:4px}
.day{min-height:84px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;cursor:pointer}
.day.w{background:color-mix(in srgb,var(--g) 13%,var(--sf))}.day.l{background:color-mix(in srgb,var(--r) 13%,var(--sf))}.day.sel{outline:2px solid var(--ac)}.day small{color:var(--mu);font-size:11px}.day b{font-size:13px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.sc ul{margin:8px 0 12px 18px;color:var(--mu);font-size:13px}
.lc svg{width:100%;height:120px;background:var(--bg);border-radius:10px;border:1px solid var(--bd);padding:10px;margin-bottom:12px}.lc p{color:var(--mu);font-size:13.5px;line-height:1.45;margin-top:4px}
.vsec{margin:28px 0}.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.vhead h2{margin-bottom:3px}.vfilters{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 10px;margin-bottom:8px;scrollbar-width:thin}.vfilter{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}.vfilter-count{font:11px 'Geist Mono',monospace;color:var(--mu)}.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.vcard{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}.vcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px #10172a14}.vthumb{display:block;position:relative;aspect-ratio:16/9;background:var(--ac2);overflow:hidden}.vthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.vcard:hover .vthumb img{transform:scale(1.035)}.vplay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 45%,#060b1899)}.vplay i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#3730a3;box-shadow:0 3px 14px #0005}.vplay .i{width:20px;height:20px}.vdur{position:absolute;right:9px;bottom:9px;padding:2px 7px;border-radius:6px;background:#0b1020e8;color:#fff;font:500 11px 'Geist Mono',monospace}.vbody{padding:15px;display:flex;flex-direction:column;flex:1}.vtag{align-self:flex-start;border-radius:999px;background:var(--ac2);color:var(--ac);padding:3px 9px;font-size:11px;font-weight:600;margin-bottom:9px}.vbody h3{line-height:1.4;margin-bottom:6px}.vbody p{color:var(--mu);font-size:13px;line-height:1.45;margin-bottom:13px}.vfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}.vsource{font-size:11px;color:var(--mu)}.vlink{font-size:12px;text-decoration:none}
.ctintro{margin-bottom:18px}.ctgroup{margin:24px 0}.ctgroup>h2{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ctgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.ctcard{padding:15px}.ctcard h3{margin-bottom:6px}.ctcard p{font-size:13px;line-height:1.5;color:var(--mu)}.ctcard p+p{margin-top:8px}.ctlabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);font-weight:600}.ctvisual{height:92px;margin:-15px -15px 12px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bd);overflow:hidden}.ctvisual svg{display:block;width:100%;height:100%}.ctsearch{position:relative;flex:1 1 260px;max-width:480px}.ctsearch input{padding-left:36px}.ctsearch .i{position:absolute;left:11px;top:10px;color:var(--mu)}.ctfilters{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 10px;scrollbar-width:thin}.ctfilters .btn{white-space:nowrap}.ctcallout{border-left:3px solid var(--ac);padding:12px 14px;background:var(--ac2);border-radius:0 9px 9px 0;font-size:13px}
.guide-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 20px}.guide-tab{min-height:58px;justify-content:space-between;padding:10px 14px}.guide-tab.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}.guide-tab small{font-size:11px;color:var(--mu);font-weight:400}.guide-panel{min-width:0}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.fg .wide{grid-column:1/-1}.fs{grid-column:1/-1;font-weight:600;font-size:13px;color:var(--ac);padding-top:6px}
dialog{border:1px solid var(--bd);border-radius:12px;padding:0;background:var(--sf);color:var(--tx);width:min(880px,94vw);max-height:92vh;margin:auto}
dialog::backdrop{background:rgba(5,8,20,.55)}.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd)}
.db{padding:20px;overflow:auto;max-height:70vh}.df{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bd)}
#lb{position:fixed;inset:0;background:rgba(5,8,20,.85);display:grid;place-items:center;z-index:40;cursor:zoom-out}#lb img{max-width:92%;max-height:92%;border-radius:10px}[hidden]{display:none!important}
.thumb{width:150px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:26px;box-shadow:0 18px 50px #10172a12}.auth-card h1{margin-bottom:6px}.auth-card p{margin:0 0 18px}.auth-card form{display:grid;gap:14px}.auth-card .btn{justify-content:center}.auth-error{color:var(--r);min-height:1.5em}.auth-links{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.auth-links button{border:0;background:none;color:var(--ac);font:inherit;cursor:pointer}.account-email{overflow-wrap:anywhere}.account-footer{display:grid;gap:2px;overflow:hidden;padding:10px 8px;font-size:12px}.account-footer small{color:var(--mu);overflow-wrap:anywhere}.sync-state{font-size:12px;color:var(--mu);margin-top:8px}.toast{position:fixed;right:16px;bottom:16px;z-index:60;max-width:min(420px,calc(100vw - 32px));padding:12px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);box-shadow:0 8px 30px #10172a24}
button:disabled{opacity:.55;cursor:not-allowed}.admin-list{display:grid;gap:10px}.admin-list .card{min-width:0}.admin-list .row>div:first-child{min-width:0;overflow-wrap:anywhere}
@media(max-width:1024px){#side{width:64px;align-items:center;padding:14px 8px}#side a span,.brand span,.account-footer{display:none}#side a{padding:10px}.brand{padding:2px 0 14px}main{margin-left:64px;padding:22px 20px 48px}.g2,.g11{grid-template-columns:1fr}}
@media(max-width:700px){#side{inset:auto 0 0 0;width:auto;height:58px;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--bd);padding:6px}#side .brand,#side .sp,#side .tt{display:none}#side a{padding:10px 11px}
 main{margin:0;padding:14px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}.top .brand{padding:0}
 .day{min-height:58px;padding:5px}.day small{display:none}.day b{font-size:10.5px}.kpi .kv{font-size:20px}.tb>*{flex:1 1 130px}.guide-tabs{gap:6px}.guide-tab{min-height:52px;padding:8px;font-size:12px;gap:4px}.guide-tab small{font-size:10px}}
@media(max-width:700px){.jtrade,.shared-trade{grid-template-columns:1fr}.jtrade-learning,.shared-trade-learning{border-left:0;border-top:1px solid var(--bd)}.jtrade-main,.jtrade-learning,.shared-trade-main,.shared-trade-learning{padding:14px}.share-item{align-items:flex-start;flex-direction:column}.share-item-actions{justify-content:flex-start}.share-form{align-items:stretch;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="authGate" class="auth-shell">
 <div class="auth-card">
  <div class="brand"><div class="logo" id="authLogo"></div><span>Trading Journal</span></div>
  <h1 id="authTitle">Sign in</h1>
  <p class="mu" id="authDescription">Sign in to access your private trading journal.</p>
  <div id="authSetup" class="card" hidden></div>
  <form id="authForm">
   <label id="authNameWrap" hidden>Profile name<input id="authName" name="name" autocomplete="name" maxlength="80"></label>
   <label id="authEmailWrap">Email<input id="authEmail" name="email" type="email" autocomplete="username" required></label>
   <label id="authPasswordWrap">Password<input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required></label>
   <button id="authSubmit" class="btn pr" type="submit">Sign in</button>
   <div id="authError" class="auth-error" role="status" aria-live="polite"></div>
  </form>
  <div id="authLinks" class="auth-links"><button id="authModeToggle" type="button">Create an account</button><button id="authForgot" type="button">Forgot password?</button></div>
 </div>
</section>
<div id="appShell" hidden>
<div class="top"><div class="brand"><div class="logo" id="lg1"></div>Trading Journal</div><button class="btn sm" onclick="flip()" aria-label="Toggle theme" id="tm1"></button></div>
<nav id="side" aria-label="Main"></nav>
<main><div class="wrap" id="pg"></div></main>
<div id="tip" hidden></div>
<div id="lb" hidden onclick="this.hidden=true"><img alt="Chart screenshot"></div>

<dialog id="dlg"><form id="tform" method="dialog">
 <div class="dh"><h2 id="dt" style="margin:0">New trade</h2><button type="button" class="btn sm" onclick="dlg.close()" aria-label="Close" id="x1"></button></div>
 <div class="db"><div class="fg">
  <div class="fs">Setup</div>
  <label>Date<input type="date" name="date" required></label>
  <label>Symbol<input name="symbol" placeholder="NIFTY, RELIANCE" required></label>
  <label>Direction<select name="dir"><option>Long</option><option>Short</option></select></label>
  <label>Strategy<select name="strat"></select></label>
  <label>Time frame<select name="tf"><option>1m</option><option>5m</option><option>15m</option><option>30m</option><option>1H</option><option>4H</option><option>Daily</option><option>Weekly</option></select></label>
  <label>Trend<select name="trend"><option>Bullish</option><option>Bearish</option><option>Sideways</option></select></label>
  <div class="fs">Setup and market situation</div>
  <label>Setup type<select name="setup"><option value="">Not specified</option><option>Breakout</option><option>Pullback</option><option>Trend continuation</option><option>Reversal</option><option>Range bounce</option><option>Momentum</option><option>Support or resistance</option><option>News or event</option><option>Other</option></select></label>
  <label>Market situation<select name="market"><option value="">Not specified</option><option>Trending</option><option>Range-bound</option><option>Volatile</option><option>Low volatility</option><option>Gap up or down</option><option>News or event</option><option>Low liquidity</option><option>Other</option></select></label>
  <div class="fs">Levels and size</div>
  <label>Entry<input type="number" step="any" name="entry" required></label>
  <label>Stop loss<input type="number" step="any" name="sl" required></label>
  <label>Did you trail the stop?<select name="trailUsed"><option value="">Not specified</option><option>No</option><option>Yes</option></select></label>
  <label>Final trailed stop price<input type="number" step="any" name="trailPrice" placeholder="Optional"></label>
  <label>Target<input type="number" step="any" name="target" required></label>
  <label>Exit<input type="number" step="any" name="exit" required></label>

async function loadSharingData(force=false){
 if(!authUser||sharingLoading||(!force&&sharingLoaded))return;
 const userId=authUser.id;sharingLoading=true;sharingError='';
 try{const{data,error}=await supabaseClient.rpc('list_journal_shares');if(error)throw error;if(authUser?.id!==userId)return;shareItems=Array.isArray(data)?data:[];sharingLoaded=true}
 catch(error){if(authUser?.id===userId){sharingError=error.message||String(error);sharingLoaded=false}}
 finally{if(authUser?.id===userId){sharingLoading=false;if(location.hash==='#sharing')render()}}
}
async function submitShareRequest(event){
 event.preventDefault();const form=event.currentTarget,email=new FormData(form).get('email')?.toString().trim();if(!email)return;
 try{const{error}=await supabaseClient.rpc('request_journal_access',{target_email:email});if(error)throw error;form.reset();showToast('If that email belongs to a confirmed account, a journal access request has been sent.');sharingLoaded=false;await loadSharingData(true)}
 catch(error){showToast(`Could not send the journal request: ${error.message||error}`)}
}
async function respondToShare(id,accept){
 const userId=authUser?.id;if(!userId)return;
 try{const{error}=await supabaseClient.rpc('respond_journal_access',{request_id:id,accept_request:accept});if(error)throw error;if(authUser?.id!==userId)return;sharingLoaded=false;sharedJournal=null;sharedJournalId='';await loadSharingData(true);showToast(accept?'Journal access approved. The requester can now view your trades.':'Journal request declined.')}
 catch(error){if(authUser?.id===userId)showToast(`Could not update the journal request: ${error.message||error}`)}
}
async function removeShare(id){
 const share=shareItems.find(item=>item.share_id===id);if(!share)return;
 const owner=share.owner_id===authUser?.id,verb=owner?'Revoke this person’s access to your journal?':'Stop sharing this journal with your account?';
 if(!confirm(verb))return;
 const userId=authUser?.id;if(!userId)return;
 try{const{error}=await supabaseClient.rpc('remove_journal_access',{request_id:id});if(error)throw error;if(authUser?.id!==userId)return;sharingLoaded=false;if(sharedJournalId===share.owner_id){sharedJournal=null;sharedJournalId=''}await loadSharingData(true);showToast(owner?'Journal access revoked.':'Journal access removed.')}
 catch(error){if(authUser?.id===userId)showToast(`Could not remove journal access: ${error.message||error}`)}
}
async function viewSharedJournal(ownerId){
 const grant=shareItems.find(item=>item.owner_id===ownerId&&item.viewer_id===authUser?.id&&item.status==='accepted');if(!grant)return;
 const userId=authUser.id;sharedJournalId=ownerId;sharedJournal=null;sharedJournalLoading=true;render();
 try{const{data,error}=await supabaseClient.rpc('get_shared_journal',{journal_owner_id:ownerId});if(error)throw error;if(authUser?.id!==userId)return;
  if(!data||!Array.isArray(data.trades))throw new Error('The shared journal returned unexpected data.');
  sharedJournal={ownerId,trades:data.trades,currency:typeof data.currency==='string'?data.currency:C.cur};
 }catch(error){if(authUser?.id===userId){sharedJournalId='';showToast(`Could not load the shared journal: ${error.message||error}`)}}
 finally{if(authUser?.id===userId){sharedJournalLoading=false;if(location.hash==='#sharing')render()}}
}
const sharedMoney=(value,currency)=>`${num(value)<0?'−':num(value)>0?'+':''}${esc(currency||C.cur)}${Math.abs(num(value)).toLocaleString('en-IN',{maximumFractionDigits:2})}`;
const sharedTradeCard=(t,currency)=>{const learning=typeof t.learn==='string'?t.learn.trim():'',mistake=typeof t.mist==='string'?t.mist.trim():'',context=[t.strat,t.setup,t.market,t.tf,t.trend].filter(Boolean).map(esc).join(' · ');

function sharingItem(item){
 const isOwner=item.owner_id===authUser?.id,name=esc(item.partner_display_name||item.partner_email||'Trading journal'),email=esc(item.partner_email||''),status=esc(item.status);
 let actions='';
 if(item.status==='pending'&&isOwner)actions=`<button class="btn pr sm" onclick="respondToShare(${jsArg(item.share_id)},true)">Accept</button><button class="btn dg sm" onclick="respondToShare(${jsArg(item.share_id)},false)">Decline</button>`;
 else if(item.status==='pending')actions=`<button class="btn sm" onclick="removeShare(${jsArg(item.share_id)})">Cancel request</button>`;
 else if(item.status==='accepted'&&!isOwner)actions=`<button class="btn pr sm" onclick="viewSharedJournal(${jsArg(item.owner_id)})">View journal</button><button class="btn sm" onclick="removeShare(${jsArg(item.share_id)})">Stop viewing</button>`;
 else if(item.status==='accepted')actions=`<button class="btn dg sm" onclick="removeShare(${jsArg(item.share_id)})">Revoke access</button>`;
 else actions=`<button class="btn sm" onclick="removeShare(${jsArg(item.share_id)})">Remove</button>`;
 const relationship=isOwner?'Your journal · requested by':'Shared journal · from';
 return `<article class="share-item"><div class="share-item-main"><b>${name}</b><div class="mu">${email}</div><span class="share-state">${relationship} · ${status}</span></div><div class="share-item-actions">${actions}</div></article>`;
}

function parseYoutubeId(value){
 try{const u=new URL(value);if(u.protocol!=='https:')throw new Error();const host=u.hostname.toLowerCase();if(host==='youtu.be'){const id=u.pathname.split('/').filter(Boolean)[0];if(/^[-\w]{11}$/.test(id||''))return id}
  if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(host)){const id=u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts)\/([-\w]{11})(?:\/|$)/)?.[1];if(/^[-\w]{11}$/.test(id||''))return id}
 }catch{}throw new Error('Paste a valid HTTPS YouTube watch, short, or embed link.');
}

 if(!isAdmin)return;const viewerId=authUser.id;adminSelectedUser=userId;adminJournalLoading=true;adminJournalError='';adminJournalText='';render();
 try{const{data,error}=await supabaseClient.from('journal_data').select('trades,strategies,notes,settings').eq('user_id',userId).maybeSingle();if(error)throw error;if(adminSelectedUser===userId&&authUser?.id===viewerId&&isAdmin)adminJournalText=JSON.stringify(data||{trades:[],strategies:[],notes:[],settings:{}},null,2)}
 catch(error){if(adminSelectedUser===userId&&authUser?.id===viewerId)adminJournalError=error.message||String(error)}
 finally{if(adminSelectedUser===userId&&authUser?.id===viewerId){adminJournalLoading=false;if(location.hash==='#admin')render()}}
}
function closeAdminJournal(){adminSelectedUser=null;adminJournalLoading=false;adminJournalText='';adminJournalError='';render()}
async function saveAdminJournal(){
 if(!isAdmin||!adminSelectedUser)return;const viewerId=authUser.id,targetId=adminSelectedUser,raw=$('#adminJournalJson')?.value??adminJournalText;
 adminJournalText=raw;
 try{if(raw.length>2_000_000)throw new Error('Journal JSON is too large to save.');const data=JSON.parse(raw);if(!data||typeof data!=='object'||Array.isArray(data)||!Array.isArray(data.trades)||!Array.isArray(data.strategies)||!Array.isArray(data.notes)||!data.settings||typeof data.settings!=='object'||Array.isArray(data.settings))throw new Error('Use an object with trades, strategies, and notes arrays plus a settings object.');
  const{error}=await supabaseClient.from('journal_data').upsert({user_id:targetId,trades:data.trades,strategies:data.strategies,notes:data.notes,settings:data.settings},{onConflict:'user_id'});if(error)throw error;if(authUser?.id!==viewerId||!isAdmin||adminSelectedUser!==targetId)return;adminJournalText=JSON.stringify(data,null,2);adminJournalError='';adminUsers=adminUsers.map(u=>u.user_id===targetId?{...u,has_journal:true}:u);showToast('User journal saved.');render()
 }catch(error){if(authUser?.id===viewerId&&adminSelectedUser===targetId){adminJournalError=error.message||String(error);render()}}
}
async function deleteAdminJournal(){
 if(!isAdmin||!adminSelectedUser)return;const user=adminUsers.find(u=>u.user_id===adminSelectedUser);if(!confirm(`Permanently delete the journal data for ${user?.email||'this user'}? Their account will remain.`))return;
 const viewerId=authUser.id,targetId=adminSelectedUser;
 try{const{error}=await supabaseClient.from('journal_data').delete().eq('user_id',targetId);if(error)throw error;if(authUser?.id!==viewerId||!isAdmin||adminSelectedUser!==targetId)return;adminJournalText=JSON.stringify({trades:[],strategies:[],notes:[],settings:{}},null,2);adminUsers=adminUsers.map(u=>u.user_id===targetId?{...u,has_journal:false}:u);showToast('User journal deleted.');render()}
 catch(error){if(authUser?.id===viewerId&&adminSelectedUser===targetId){adminJournalError=error.message||String(error);render()}}
}
function downloadAdminJournal(){if(!isAdmin||!adminSelectedUser)return;const user=adminUsers.find(u=>u.user_id===adminSelectedUser),name=String(user?.email||'user').replace(/[^a-z0-9._-]/gi,'_');dl(`journal-${name}.json`,$('#adminJournalJson')?.value||adminJournalText,'application/json')}
async function deleteAdminUser(userId){
 if(!isAdmin||userId===authUser?.id)return;const user=adminUsers.find(u=>u.user_id===userId);if(!user)return;
 if(!confirm(`Permanently delete ${user.email||'this user'} and all of their journal data? This cannot be undone.`))return;
 const viewerId=authUser.id;
 try{const{error}=await supabaseClient.rpc('admin_delete_user',{target_user_id:userId});if(error)throw error;if(authUser?.id!==viewerId||!isAdmin)return;adminUsers=adminUsers.filter(u=>u.user_id!==userId);if(adminSelectedUser===userId)closeAdminJournal();else render();showToast('User account and journal permanently deleted.')}
 catch(error){if(authUser?.id===viewerId){adminUsersError=error.message||String(error);showToast(`Could not delete user: ${adminUsersError}`);render()}}
}
pages.admin=()=>{
 if(!adminCandidate())return ph('Admin','This account is not authorized to manage the site')+'<div class="card">Sign in with the designated administrator account.</div>';
 if(!isAdmin)return ph('Admin','Administrator setup required')+`<div class="card"><h2>Enable secure administrator access</h2><p class="mu">Run <b>supabase/admin.sql</b> once in your Supabase SQL Editor, then sign out and sign back in. The database checks the confirmed account email before allowing any admin action.</p>${adminAccessError?`<p class="auth-error" role="status">${esc(adminAccessError)}</p>`:''}</div>`;
 const tabs=[['learning','Learning content'],['users','User management']].map(([key,title])=>`<button class="btn ${adminTab===key?'on':''}" onclick="setAdminTab(${jsArg(key)})">${title}</button>`).join('');
 return ph('Admin','Manage learning materials, user accounts, and private journals')+`<div class="row" style="margin-bottom:16px">${tabs}</div>${adminTab==='learning'?pagesAdminLearning():pagesAdminUsers()}`;
};
pages.settings=()=>ph('Settings','Account, appearance and your data')+
 `<div class="g g11"><div class="card"><h2>Profile</h2><p class="mu account-email">${esc(authUser?.email||'')}</p><form onsubmit="saveProfile(event)" style="margin-top:12px"><label>Display name<input id="profileName" maxlength="80" value="${esc(authUser?.user_metadata?.display_name||'')}" autocomplete="name" required></label><div class="row" style="margin-top:10px"><button class="btn" type="submit">Save profile</button><button class="btn" type="button" onclick="sendPasswordReset()">Change password</button><button class="btn dg" type="button" onclick="signOut()">Sign out</button></div></form></div>
 <div class="card"><h2>Cloud sync</h2><p class="mu">Your journal is private unless you approve a read-only sharing request. You can revoke access at any time.</p><div id="syncState" class="sync-state" role="status" aria-live="polite">Synced</div><button class="btn sm" style="margin-top:8px" onclick="retryCloudSave()">Retry sync</button></div></div>
 <div class="g g11"><div class="card"><h2>Appearance</h2>${seg([['light','Light'],['dark','Dark'],['system','System']],C.theme,'setTheme')}<div style="height:18px"></div><div class="fg"><label>Currency symbol<input value="${esc(C.cur)}" maxlength="3" onchange="C.cur=this.value||'₹';persist();render()"></label><label>Starting capital<input type="number" min="0" step="any" value="${C.cap||''}" placeholder="Optional" onchange="C.cap=num(this.value);persist();render()"></label></div><p class="mu" style="margin-top:10px">Starting capital sets the first point of the equity curve and the return on capital shown on the dashboard.</p></div>
 <div class="card"><h2>Data</h2><p class="mu" style="margin-bottom:12px">Your journal is saved to your private cloud account. Back up regularly.</p><div class="row"><button class="btn" onclick="exCsv()">${ic('dl')}Export CSV</button><button class="btn" onclick="exJson()">${ic('dl')}Backup</button><button class="btn" onclick="$('#impF').click()">${ic('ul')}Restore backup</button><button class="btn" onclick="importLegacy()">Import old browser data</button><button class="btn dg" onclick="wipe()">Delete all trades</button></div></div>
 </div></div>`;

// ---- router
function render(){const requested=location.hash.slice(1),pg=requested==='chart-guide'?'guide':pages[requested]?requested:'dashboard';if(requested==='chart-guide')history.replaceState(null,'','#guide');post=[];
 const navItems=isAdmin||adminCandidate()?[...NAV,['admin','gear','Admin']]:NAV;
 $('#side').innerHTML=`<div class="brand"><div class="logo">${ic('up')}</div><span>Trading Journal</span></div>`+navItems.map(([h,i,l])=>`<a href="#${h}" class="${h===pg?'on':''}" ${h===pg?'aria-current="page"':''} title="${l}">${ic(i)}<span>${l}</span></a>`).join('')+`<div class="sp"></div><div class="account-footer"><b>${esc(authUser?.user_metadata?.display_name||'')}</b><small class="account-email">${esc(authUser?.email||'')}</small></div><button class="btn tt" id="tm2" onclick="flip()" aria-label="Toggle theme"></button>`;
 $('#pg').innerHTML=pages[pg]();applyTheme();post.forEach(f=>f())}
function chartGuideFill(){const root=$('#ctGuideGrid');if(!root)return;const q=chartSearch.trim().toLowerCase();let total=0;
 root.querySelectorAll('.ctgroup').forEach(section=>{let count=0;section.querySelectorAll('.ctcard').forEach(card=>{const show=(chartGroup==='All'||section.dataset.group===chartGroup)&&(!q||card.textContent.toLowerCase().includes(q));card.hidden=!show;if(show){count++;total++}});section.hidden=count===0});
 const count=$('#ctCount'),empty=$('#ctEmpty');if(count)count.textContent=`Showing ${total} of ${CT.length} tools`;if(empty)empty.hidden=total!==0}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});

// ---- actions
const setPer=k=>{per=k;render()},setPm=k=>{pm=k;render()},setNf=k=>{nf=k;render()},setLc=k=>{lcat=k;render()},setVideoCat=k=>{videoCategory=k;render()},setChartGroup=k=>{chartGroup=k;render()},setGuideSection=k=>{guideSection=k;render()},setAdminTab=k=>{adminTab=k;if(k==='users')adminUsersLoaded=false;render()},setTheme=k=>{C.theme=k;persist();render()},setJournalView=k=>{journalView=k;jfill()};
const fset=(k,v)=>{F[k]=v;k==='q'?jfill():render()},cmv=n=>{cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);cd=null;render()},selDay=k=>{cd=cd===k?null:k;render()};
const zoomT=id=>{$('#lb img').src=T.find(t=>t.id===id).img;$('#lb').hidden=false};
function addNote(){const t=$('#nt').value.trim(),b=$('#nb').value.trim();if(!b)return;N.push({id:Date.now(),date:td(),title:t||'Note',body:b});persist();render()}
function delNote(id){if(confirm('Delete this note?')){N=N.filter(n=>n.id!==id);persist();render()}}
const dl=(n,t,mt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:mt}));a.download=n;a.click()};
function exJson(){dl('trading-journal-backup.json',JSON.stringify({trades:T,strats:S,notes:N,settings:C}),'application/json')}
function exCsv(){if(!T.length)return;const k=['date','symbol','dir','strat','tf','trend','setup','market','entry','sl','trailUsed','trailPrice','target','exit','hit','exitReason','qty','cap','rr','rules','emo','fomo','over','fee','gross','net','learn','mist'];dl('trades.csv',[k.join(','),...[...T].sort(cmp).map(t=>k.map(c=>'"'+String(t[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv')}
function wipe(){if(confirm('Delete ALL trades? This cannot be undone. Export a backup first.')){T=[];persist();render()}}
$('#impF').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(confirm('Replace current data with this backup?')){if(Array.isArray(d))T=d;else{T=d.trades||[];S=d.strats||S;N=d.notes||[];C=Object.assign(C,d.settings||{})}persist();render()}}catch(x){alert('This is not a valid backup file.')}};r.readAsText(e.target.files[0])};
function importLegacy(){try{const read=k=>{const raw=localStorage.getItem(k);return raw===null?null:JSON.parse(raw)},trades=read(K.t),strats=read(K.s),notes=read(K.n),settings=read(K.c);if([trades,strats,notes,settings].every(v=>v===null)){showToast('No previous browser-only journal data was found.');return}
 if(trades!==null&&!Array.isArray(trades)||strats!==null&&!Array.isArray(strats)||notes!==null&&!Array.isArray(notes))throw new Error('The saved browser data has an unexpected format.');
 if(!confirm('Replace this account journal with the old data saved in this browser? This will upload it to your signed-in account.'))return;
 T=trades||[];S=strats||defaultStrategies();N=notes||[];C=Object.assign({cur:'₹',cap:0,theme:'system'},settings||{});clearLegacyAfterSync=true;persist();render();showToast('Previous browser data is being imported to this account.')
 }catch(error){showToast(`Could not import browser data: ${error.message||error}`)}}

// ---- trade dialog
const fm=$('#tform'),fe=fm.elements;
function calc(){const e=num(fe.entry.value),s=num(fe.sl.value),t=num(fe.target.value),x=num(fe.exit.value),q=num(fe.qty.value),risk=Math.abs(e-s),rew=Math.abs(t-e),sg=fe.dir.value==='Long'?1:-1;
 fe.rr.value=risk>0&&rew>0?'1:'+(rew/risk).toFixed(1):'';
 if(!fe.cap.dataset.manual&&e&&q)fe.cap.value=(e*q).toFixed(2);
 if(fe.exit.value!==''&&fe.entry.value!==''&&!fe.gross.dataset.manual)fe.gross.value=((x-e)*sg*q).toFixed(2);
 fe.net.value=fe.gross.value!==''?(num(fe.gross.value)-num(fe.fee.value)).toFixed(2):''}
fm.addEventListener('input',e=>{if(e.target===fe.gross)fe.gross.dataset.manual=1;if(e.target===fe.cap)fe.cap.dataset.manual=1;calc()});
fe.dir.addEventListener('change',()=>{delete fe.gross.dataset.manual;calc()});
function openTrade(id){fm.reset();delete fe.gross.dataset.manual;delete fe.cap.dataset.manual;curImg=null;$('#pv').hidden=true;editId=id||null;
 const t=id&&T.find(x=>x.id===id),names=S.map(s=>s.name);if(t&&t.strat&&!names.includes(t.strat))names.push(t.strat);
 fe.strat.innerHTML='<option value="">None</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
 if(t){for(const k in t)if(k!=='id'&&k!=='img'&&fe[k])fe[k].value=t[k];fe.gross.dataset.manual=1;fe.cap.dataset.manual=1;curImg=t.img||null;if(curImg){$('#pv').src=curImg;$('#pv').hidden=false}}else fe.date.value=td();
 $('#dt').textContent=t?'Edit trade':'New trade';$('#dDel').hidden=!t;calc();dlg.showModal()}
fm.addEventListener('submit',ev=>{ev.preventDefault();calc();const d=Object.fromEntries(new FormData(fm));delete d.shot;d.img=curImg;d.net=num(d.gross)-num(d.fee);d.id=editId||Date.now();
 if(editId)T=T.map(t=>t.id===editId?d:t);else T.push(d);persist();dlg.close();render()});
$('#dDel').onclick=()=>{if(confirm('Delete this trade?')){T=T.filter(t=>t.id!==editId);persist();dlg.close();render()}};
$('#shot').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);curImg=c.toDataURL('image/jpeg',.65);$('#pv').src=curImg;$('#pv').hidden=false};im.src=URL.createObjectURL(fl)};

// ---- strategy dialog
const sf=$('#sform'),se=sf.elements;
function openStrat(id){sf.reset();editS=id||null;const s=id&&S.find(x=>x.id===id);if(s){se.name.value=s.name;se.desc.value=s.desc||'';se.rules.value=s.rules||''}$('#sdt').textContent=s?'Edit strategy':'New strategy';$('#sDel').hidden=!s;sdlg.showModal()}
sf.addEventListener('submit',ev=>{ev.preventDefault();const d={name:se.name.value.trim(),desc:se.desc.value,rules:se.rules.value};
 if(editS){const old=S.find(x=>x.id===editS);if(old.name!==d.name)T.forEach(t=>{if(t.strat===old.name)t.strat=d.name});S=S.map(x=>x.id===editS?{...x,...d}:x)}else S.push({id:Date.now(),...d});persist();sdlg.close();render()});
$('#sDel').onclick=()=>{if(confirm('Delete this strategy? Trades keep its name.')){S=S.filter(x=>x.id!==editS);persist();sdlg.close();render()}};
