<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html[data-theme=light]{--bg:#f6f7fb;--sf:#fff;--bd:#e2e5ee;--tx:#0f172a;--mu:#5a6478;--ac:#3730a3;--ac2:#eceefd;--pb:#3730a3;--g:#0b8a5c;--r:#c4283a;--a:#a8560a;--b:#2559c9;color-scheme:light}
html[data-theme=dark]{--bg:#0a0f1f;--sf:#111830;--bd:#222b49;--tx:#e8ecf8;--mu:#97a1bf;--ac:#a5acff;--ac2:#1b2352;--pb:#5256e0;--g:#34d399;--r:#fb7185;--a:#fbbf24;--b:#7cb4ff;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono,.kv,.num,input[type=number],td.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;flex:none}.mu{color:var(--mu)}.pos{color:var(--g)}.neg{color:var(--r)}
#side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--sf);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.brand{display:flex;gap:10px;align-items:center;font-weight:650;font-size:16px;padding:2px 8px 18px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--pb);color:#fff;display:grid;place-items:center}.logo .i{width:17px;height:17px}
#side a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500}
#side a:hover{background:var(--bg);color:var(--tx)}#side a.on{background:var(--ac2);color:var(--ac)}
#side .sp{flex:1}.top{display:none}
main{margin-left:236px;padding:28px 32px 56px}.wrap{max-width:1240px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em}h2{font-size:15px;font-weight:600;margin-bottom:12px}h3{font-size:14px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px}
.g{display:grid;gap:16px;margin-bottom:16px}.k6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:2fr 1fr}.g11{grid-template-columns:1fr 1fr}
.kpi .kv{font-size:24px;font-weight:600;margin:4px 0 2px;letter-spacing:-.02em}.ks{font-size:12px}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 14px;font:500 14px 'Geist';cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:background .15s}
.btn:hover{background:var(--bg)}.btn.pr{background:var(--pb);border-color:var(--pb);color:#fff}.btn.pr:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:13px}.btn.dg{color:var(--r)}.btn.on{background:var(--ac2);color:var(--ac);border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select,textarea{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:14px 'Geist';width:100%}
textarea{resize:vertical;min-height:70px}label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mu);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;color:var(--mu);font:500 13px 'Geist';cursor:pointer}.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 0 0 1px var(--bd)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tb>*{width:auto;flex:0 1 150px}.tb>.seg{flex:none}.tb .search{flex:1 1 220px;position:relative}.tb .search input{padding-left:34px}.tb .search .i{position:absolute;left:10px;top:9px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
th{color:var(--mu);text-align:left;padding:8px 10px;font-weight:500;font-size:12px;white-space:nowrap}td{padding:10px;border-top:1px solid var(--bd);vertical-align:middle}
.num{text-align:right}th.num{text-align:right}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--bg)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--bd);color:var(--mu);margin:0 4px 2px 0;white-space:nowrap}.tag.neg{color:var(--r);border-color:currentColor}.tag.pos{color:var(--g);border-color:currentColor}
canvas.ch{width:100%;height:250px;display:block}.empty{color:var(--mu);padding:36px 12px;text-align:center}
#tip{position:fixed;pointer-events:none;background:var(--tx);color:var(--bg);padding:6px 10px;border-radius:8px;font:12px 'Geist Mono';z-index:30;line-height:1.5}
.dn{width:150px;height:150px;display:block;margin:0 auto 10px}.lrow{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
.rl{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}.rl:first-of-type{border-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{color:var(--mu);font-size:12px;text-align:center;padding:4px}
.day{min-height:84px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;cursor:pointer}
.day.w{background:color-mix(in srgb,var(--g) 13%,var(--sf))}.day.l{background:color-mix(in srgb,var(--r) 13%,var(--sf))}.day.sel{outline:2px solid var(--ac)}.day small{color:var(--mu);font-size:11px}.day b{font-size:13px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.sc ul{margin:8px 0 12px 18px;color:var(--mu);font-size:13px}
.lc svg{width:100%;height:120px;background:var(--bg);border-radius:10px;border:1px solid var(--bd);padding:10px;margin-bottom:12px}.lc p{color:var(--mu);font-size:13.5px;line-height:1.45;margin-top:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.fg .wide{grid-column:1/-1}.fs{grid-column:1/-1;font-weight:600;font-size:13px;color:var(--ac);padding-top:6px}
dialog{border:1px solid var(--bd);border-radius:12px;padding:0;background:var(--sf);color:var(--tx);width:min(880px,94vw);max-height:92vh;margin:auto}
dialog::backdrop{background:rgba(5,8,20,.55)}.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd)}
.db{padding:20px;overflow:auto;max-height:70vh}.df{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bd)}
#lb{position:fixed;inset:0;background:rgba(5,8,20,.85);display:grid;place-items:center;z-index:40;cursor:zoom-out}#lb img{max-width:92%;max-height:92%;border-radius:10px}[hidden]{display:none!important}
.thumb{width:150px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:26px;box-shadow:0 18px 50px #10172a12}.auth-card h1{margin-bottom:6px}.auth-card p{margin:0 0 18px}.auth-card form{display:grid;gap:14px}.auth-card .btn{justify-content:center}.auth-error{color:var(--r);min-height:1.5em}.auth-links{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.auth-links button{border:0;background:none;color:var(--ac);font:inherit;cursor:pointer}.account-email{overflow-wrap:anywhere}.account-footer{display:grid;gap:2px;overflow:hidden;padding:10px 8px;font-size:12px}.account-footer small{color:var(--mu);overflow-wrap:anywhere}.sync-state{font-size:12px;color:var(--mu);margin-top:8px}.toast{position:fixed;right:16px;bottom:16px;z-index:60;max-width:min(420px,calc(100vw - 32px));padding:12px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);box-shadow:0 8px 30px #10172a24}
@media(max-width:1024px){#side{width:64px;align-items:center;padding:14px 8px}#side a span,.brand span,.account-footer{display:none}#side a{padding:10px}.brand{padding:2px 0 14px}main{margin-left:64px;padding:22px 20px 48px}.g2,.g11{grid-template-columns:1fr}}
@media(max-width:700px){#side{inset:auto 0 0 0;width:auto;height:58px;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--bd);padding:6px}#side .brand,#side .sp,#side .tt{display:none}#side a{padding:10px 11px}
 main{margin:0;padding:14px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}.top .brand{padding:0}
 .day{min-height:58px;padding:5px}.day small{display:none}.day b{font-size:10.5px}.kpi .kv{font-size:20px}.tb>*{flex:1 1 130px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="authGate" class="auth-shell">
 <div class="auth-card">
  <div class="brand"><div class="logo" id="authLogo"></div><span>Trading Journal</span></div>
  <h1 id="authTitle">Sign in</h1>
  <p class="mu" id="authDescription">Sign in to access your private trading journal.</p>
  <div id="authSetup" class="card" hidden></div>
  <form id="authForm">
   <label id="authNameWrap" hidden>Profile name<input id="authName" name="name" autocomplete="name" maxlength="80"></label>
   <label id="authEmailWrap">Email<input id="authEmail" name="email" type="email" autocomplete="username" required></label>
   <label id="authPasswordWrap">Password<input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required></label>
   <button id="authSubmit" class="btn pr" type="submit">Sign in</button>
   <div id="authError" class="auth-error" role="status" aria-live="polite"></div>
  </form>
  <div id="authLinks" class="auth-links"><button id="authModeToggle" type="button">Create an account</button><button id="authForgot" type="button">Forgot password?</button></div>
 </div>
</section>
<div id="appShell" hidden>
<div class="top"><div class="brand"><div class="logo" id="lg1"></div>Trading Journal</div><button class="btn sm" onclick="flip()" aria-label="Toggle theme" id="tm1"></button></div>
<nav id="side" aria-label="Main"></nav>
<main><div class="wrap" id="pg"></div></main>
<div id="tip" hidden></div>
<div id="lb" hidden onclick="this.hidden=true"><img alt="Chart screenshot"></div>

<dialog id="dlg"><form id="tform" method="dialog">
 <div class="dh"><h2 id="dt" style="margin:0">New trade</h2><button type="button" class="btn sm" onclick="dlg.close()" aria-label="Close" id="x1"></button></div>
 <div class="db"><div class="fg">
  <div class="fs">Setup</div>
  <label>Date<input type="date" name="date" required></label>
  <label>Symbol<input name="symbol" placeholder="NIFTY, RELIANCE" required></label>
  <label>Direction<select name="dir"><option>Long</option><option>Short</option></select></label>
  <label>Strategy<select name="strat"></select></label>
  <label>Time frame<select name="tf"><option>1m</option><option>5m</option><option>15m</option><option>30m</option><option>1H</option><option>4H</option><option>Daily</option><option>Weekly</option></select></label>
  <label>Trend<select name="trend"><option>Bullish</option><option>Bearish</option><option>Sideways</option></select></label>
  <div class="fs">Levels and size</div>
  <label>Entry<input type="number" step="any" name="entry" required></label>
  <label>Stop loss<input type="number" step="any" name="sl" required></label>
  <label>Target<input type="number" step="any" name="target" required></label>
  <label>Exit<input type="number" step="any" name="exit" required></label>
  <label>Target hit<select name="hit"><option>No</option><option>Yes</option></select></label>
  <label>Quantity<input type="number" step="any" name="qty" required></label>
  <label>Capital deployed (auto)<input type="number" step="any" name="cap" placeholder="Entry × quantity"></label>
  <label>Planned risk : reward<input name="rr" readonly placeholder="auto"></label>
  <div class="fs">Discipline</div>
  <label>Followed rules<select name="rules"><option>Yes</option><option>No</option></select></label>
  <label>Emotion control<select name="emo"><option>Yes</option><option>No</option></select></label>
  <label>FOMO<select name="fomo"><option>No</option><option>Yes</option></select></label>
  <label>Over trading<select name="over"><option>No</option><option>Yes</option></select></label>
  <div class="fs">Result</div>
  <label>Brokerage and charges<input type="number" step="any" name="fee" value="0"></label>
  <label>Gross P&amp;L (auto, editable)<input type="number" step="any" name="gross"></label>
  <label>Net profit<input name="net" readonly placeholder="auto"></label>
  <label class="wide">Chart screenshot<input type="file" id="shot" accept="image/*"><img id="pv" class="thumb" hidden alt="Preview" style="margin-top:6px"></label>
  <label class="wide">Learning<textarea name="learn"></textarea></label>
  <label class="wide">Mistakes<textarea name="mist"></textarea></label>
 </div></div>
 <div class="df"><button type="button" class="btn dg" id="dDel" hidden>Delete</button><span style="flex:1"></span><button type="button" class="btn" onclick="dlg.close()">Cancel</button><button class="btn pr" type="submit">Save trade</button></div>
</form></dialog>

<dialog id="sdlg"><form id="sform" method="dialog">
 <div class="dh"><h2 style="margin:0" id="sdt">Strategy</h2><button type="button" class="btn sm" onclick="sdlg.close()" aria-label="Close" id="x2"></button></div>
 <div class="db"><div class="fg"><label class="wide">Name<input name="name" required></label><label class="wide">Description<textarea name="desc"></textarea></label><label class="wide">Rules (one per line)<textarea name="rules" style="min-height:110px"></textarea></label></div></div>
 <div class="df"><button type="button" class="btn dg" id="sDel" hidden>Delete</button><span style="flex:1"></span><button type="button" class="btn" onclick="sdlg.close()">Cancel</button><button class="btn pr" type="submit">Save strategy</button></div>
</form></dialog>
<input type="file" id="impF" accept=".json" hidden>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),R=document.documentElement,dlg=$('#dlg'),sdlg=$('#sdlg');
const sv=i=>`<svg viewBox="0 0 200 100">${i}</svg>`,ST=(c,w=2.5,d='')=>`fill:none;stroke:${c};stroke-width:${w};stroke-linejoin:round;stroke-dasharray:${d}`;
const pl=(p,x='')=>sv(`<polyline points="${p}" style="${ST('var(--ac)',3)}"/>${x}`),ol=(p,c,w=2.5)=>`<polyline points="${p}" style="${ST(c,w)}"/>`;
const L=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" style="stroke:var(--mu);stroke-dasharray:4"/>`;
const cs=(a,w=30)=>{let t=`<svg viewBox="0 0 ${a.length*w+8} 100">`;a.forEach((k,i)=>{const[o,h,l,c]=k,x=i*w+w/2+4,col=c>=o?'var(--g)':'var(--r)',Y=v=>100-v;t+=`<line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" style="stroke:${col};stroke-width:2"/><rect x="${x-8}" y="${Y(Math.max(o,c))}" width="16" height="${Math.max(1.5,Math.abs(c-o))}" rx="2" style="fill:${col}"/>`});return t+'</svg>'};
const bars=(a,m=0)=>sv(a.map((h,i)=>`<rect x="${i*19+6}" y="${m?(h>0?50-h:50):100-h}" width="13" height="${Math.abs(h)}" rx="3" style="fill:${m?(h>0?'var(--g)':'var(--r)'):'var(--ac)'}"/>`).join('')+(m?L(0,50,200,50):''));
const P='0,70 20,55 40,65 60,45 80,55 100,35 120,45 140,25 160,35 180,15 200,22';
const LC=['All','Candlesticks','Chart patterns','Indicators','Structure','Risk & mind'];
const LI=[
['Candlesticks','Candle anatomy',cs([[30,80,15,70],[70,85,20,35]]),'The body runs from open to close; wicks show the high and low. Green closed above its open, red below. Long body = conviction, long wick = rejection.'],
['Candlesticks','Doji',cs([[50,78,22,51]]),'Open and close are almost equal: indecision. It matters most after a strong move or at support/resistance. Wait for the next candle to confirm.'],
['Candlesticks','Marubozu',cs([[25,75,25,75],[75,75,25,25]]),'A full body with almost no wicks. One side controlled the whole candle, so it shows strong momentum.'],
['Candlesticks','Hammer',cs([[84,86,72,74],[74,76,60,62],[62,64,46,48],[50,54,18,53]]),'After a downtrend: small body on top, long lower wick. Sellers pushed down but buyers rejected it. Bullish once the next candle closes above its high.'],
['Candlesticks','Shooting star',cs([[16,20,14,18],[18,34,16,32],[32,48,30,46],[46,86,44,48]]),'After an uptrend: small body at the bottom, long upper wick. Buyers failed to hold the highs. Bearish if a red candle follows.'],
['Candlesticks','Bullish engulfing',cs([[64,66,54,56],[56,57,42,44],[42,72,40,70]]),'A large green body that fully covers the previous red body at the end of a downtrend. Buyers took control.'],
['Candlesticks','Bearish engulfing',cs([[34,44,32,42],[42,56,41,54],[56,58,28,30]]),'A large red body covering the previous green body after an uptrend. Sellers took control.'],
['Candlesticks','Morning star',cs([[82,84,62,64],[60,62,50,54],[56,84,54,82]]),'Big red candle, a small indecision candle, then a big green candle closing deep into the first body. A bottom reversal. Evening star is the mirror at tops.'],
['Chart patterns','Double top (M)',pl('10,80 50,20 90,60 130,20 170,85',L(0,20,200,20)+L(0,60,200,60)),'Two failed attempts at the same high. Sell on a close below the neckline (the middle low). Target is about the pattern height below it; stop above the second top.'],
['Chart patterns','Double bottom (W)',pl('10,20 50,80 90,40 130,80 170,15',L(0,80,200,80)+L(0,40,200,40)),'Mirror of the double top. Buy on a close above the middle high. Target is about the pattern height; stop under the second bottom.'],
['Chart patterns','Head and shoulders',pl('5,70 35,40 60,65 100,15 140,65 165,40 195,80',L(0,65,200,65)),'Three peaks, the middle one highest. A close below the neckline signals a reversal down. The inverse version at bottoms is bullish.'],
['Chart patterns','Ascending triangle',pl('10,85 45,30 70,58 105,30 125,45 155,30 190,5',L(0,30,170,30)+L(10,72,155,38)),'Flat resistance with rising lows: buyers get more aggressive each dip. Buy the breakout above resistance, ideally with volume.'],
['Chart patterns','Bull flag',pl('10,90 55,20 75,30 100,26 120,38 145,32 190,5',L(55,20,145,32)+L(75,30,145,42)),'A sharp rally (the pole) then a small downward drift (the flag). Enter on a break above the flag; target is about the pole length. Volume should shrink inside the flag.'],
['Chart patterns','Cup and handle',pl('10,15 25,40 50,68 90,75 130,60 155,35 165,15 175,28 190,26 199,6',L(0,15,175,15)),'A rounded bottom followed by a small pullback (the handle). A breakout above the rim is bullish. Wider, smoother cups tend to be more reliable.'],
['Indicators','EMA (exponential moving average)',sv(ol(P,'var(--mu)',1.5)+ol('0,70 40,60 80,52 120,42 160,32 200,24','var(--a)')+ol('0,72 50,66 100,55 150,44 200,36','var(--b)')),'Weights recent prices more, so it reacts faster than an SMA. Common sets: 9/21 intraday, 20/50/200 for swing. Price above the 200 EMA = bullish bias; fast crossing above slow = momentum shift. It whipsaws in sideways markets.'],
['Indicators','SMA (simple moving average)',sv(ol(P,'var(--mu)',1.5)+ol('0,72 50,64 100,52 150,40 200,30','var(--a)')),'A plain average of the last N closes: slower and smoother than EMA. The 50 SMA crossing above the 200 SMA is the "golden cross"; below is the "death cross". Often acts as dynamic support or resistance.'],
['Indicators','RSI (14)',sv(L(0,30,200,30)+L(0,70,200,70)+ol('0,40 20,60 40,85 60,75 80,50 100,20 120,10 140,35 160,60 180,80 200,70','var(--ac)')),'Momentum on a 0-100 scale. Above 70 = overbought, below 30 = oversold, but strong trends can stay there. Divergence (price makes a new high, RSI does not) warns of weakness.'],
['Indicators','MACD',bars([-10,-22,-30,-18,-5,12,25,32,22,8],1),'MACD = EMA12 - EMA26, with a 9-period signal line and a histogram. MACD crossing above signal = bullish momentum; a shrinking histogram = fading momentum. It lags, so combine with price structure.'],
['Indicators','Bollinger Bands',sv(ol('0,35 40,25 80,20 120,15 160,18 200,10','var(--mu)',1.5)+ol('0,75 40,65 80,60 120,55 160,58 200,50','var(--mu)',1.5)+ol('0,55 40,47 80,40 120,37 160,34 200,30','var(--ac)')),'A 20 SMA with bands at 2 standard deviations. A squeeze (narrow bands) often comes before a big move. Walking along the upper band shows a strong trend, not an automatic sell.'],
['Indicators','VWAP',sv(ol('0,60 20,40 40,62 60,45 80,25 100,40 120,20 140,38 160,15 200,22','var(--mu)',1.5)+ol('0,55 50,48 100,40 150,32 200,28','var(--a)')),'Volume-weighted average price for the day; it resets daily. Institutions benchmark against it. Above VWAP = buyers in control intraday, below = sellers. A popular intraday entry and exit reference.'],
['Indicators','Volume',bars([30,45,25,60,40,90,35,50,70,30]),'Volume confirms moves. A breakout on high volume is more trustworthy; a rally on falling volume is weak. Watch for spikes at support and resistance.'],
['Indicators','ATR (average true range)','','The average candle range over N periods (usually 14). Use it for stops, for example stop = entry - 1.5 x ATR. Volatile market means a wider stop and a smaller quantity.'],

async function loadJournal(user){if(authUser?.id===user.id&&!$('#appShell').hidden){authUser=user;render();return}
 if(syncTimer){clearTimeout(syncTimer);syncTimer=null}
 authUser=user;resetJournal();showAuthGate();$('#authTitle').textContent='Loading your journal';$('#authDescription').textContent='Loading private account data…';$('#authForm').hidden=true;$('#authLinks').hidden=true;$('#authSetup').hidden=true;
 try{const{data,error}=await supabaseClient.from('journal_data').select('trades,strategies,notes,settings').eq('user_id',user.id).maybeSingle();if(error)throw error;
  if(data){T=Array.isArray(data.trades)?data.trades:[];S=Array.isArray(data.strategies)?data.strategies:defaultStrategies();N=Array.isArray(data.notes)?data.notes:[];C=Object.assign({cur:'₹',cap:0,theme:'system'},data.settings&&typeof data.settings==='object'?data.settings:{})}
  syncVersion=0;savedVersion=0;setSyncStatus('Synced');render();$('#appShell').hidden=false;$('#authGate').hidden=true
 }catch(error){authUser=null;$('#authTitle').textContent='Journal unavailable';$('#authDescription').textContent='Your account is signed in, but its private journal could not be loaded.';$('#authSetup').hidden=false;$('#authSetup').textContent=`${error.message||error} Check the Supabase setup and run supabase/schema.sql, then retry.`;const retry=document.createElement('button');retry.type='button';retry.className='btn';retry.textContent='Retry';retry.onclick=()=>loadJournal(user);const logout=document.createElement('button');logout.type='button';logout.className='btn';logout.textContent='Sign out';logout.onclick=()=>supabaseClient.auth.signOut().catch(reportCloudError);$('#authSetup').append(' ',retry,' ',logout);$('#authForm').hidden=true;$('#authLinks').hidden=true}
}
let savedVersion=0;
function queueCloudSave(){if(!authUser)return;syncVersion++;setSyncStatus('Saving…');if(syncTimer)clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncTimer=null;flushCloudSave().catch(reportCloudError)},500)}
async function flushCloudSave(){if(syncTimer){clearTimeout(syncTimer);syncTimer=null}if(!authUser||savedVersion>=syncVersion)return;
 const user=authUser,version=syncVersion,payload=JSON.parse(JSON.stringify({user_id:user.id,trades:T,strategies:S,notes:N,settings:C}));
 const write=syncQueue.then(async()=>{if(authUser?.id!==user.id)return;const{error}=await supabaseClient.from('journal_data').upsert(payload,{onConflict:'user_id'});if(error)throw error;if(authUser?.id===user.id){savedVersion=Math.max(savedVersion,version);if(savedVersion>=syncVersion){setSyncStatus('All changes saved');if(clearLegacyAfterSync)clearImportedLegacyData()}}});
 syncQueue=write.catch(()=>{});await write;if(authUser?.id===user.id&&savedVersion<syncVersion)await flushCloudSave()
}
function retryCloudSave(){if(!authUser)return;if(syncVersion===savedVersion)syncVersion++;setSyncStatus('Retrying…');flushCloudSave().catch(reportCloudError)}
function clearImportedLegacyData(){try{Object.values(K).forEach(key=>localStorage.removeItem(key));clearLegacyAfterSync=false;showToast('Old browser-only data was safely moved to this account and removed from this browser.')}catch(error){showToast(`The cloud import succeeded, but old browser data could not be cleared: ${error.message||error}`)}}
async function signOut(){try{await flushCloudSave();const{error}=await supabaseClient.auth.signOut();if(error)throw error}catch(error){showToast(`Sign out was canceled because your latest changes may not be saved: ${error.message||error}`)}}
async function saveProfile(event){event.preventDefault();const name=$('#profileName').value.trim();if(!name)return;try{const{data,error}=await supabaseClient.auth.updateUser({data:{display_name:name}});if(error)throw error;if(data.user){authUser=data.user;render();showToast('Profile updated.')}}catch(error){showToast(`Could not update your profile: ${error.message||error}`)}}
async function sendPasswordReset(){const email=authUser?.email||$('#authEmail').value.trim();if(!email){$('#authError').textContent='Enter your account email first.';return}try{const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;showToast('If that account exists, a password reset email has been sent.')}catch(error){$('#authError').textContent=error.message||String(error)}}
function initAuth(){const config=window.TRADE_TRACKER_CONFIG||{};if(!window.supabase?.createClient){$('#authSetup').hidden=false;$('#authSetup').textContent='The authentication library could not be loaded. Check your internet connection and reload.';$('#authForm').hidden=true;$('#authLinks').hidden=true;return}
 if(!config.supabaseUrl||!config.supabaseAnonKey){$('#authSetup').hidden=false;$('#authSetup').textContent='Cloud sign-in is not configured yet. Create a Supabase project, set its URL and publishable key in supabase-config.js, then run supabase/schema.sql in the project SQL editor.';$('#authSubmit').disabled=true;$('#authModeToggle').hidden=true;$('#authForgot').hidden=true;return}
 supabaseClient=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 supabaseClient.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{if(event==='PASSWORD_RECOVERY'){showAuthGate();showAuthMode('update-password');$('#authForm').hidden=false;$('#authLinks').hidden=true;return}
  if(session?.user){if(['INITIAL_SESSION','SIGNED_IN','USER_UPDATED'].includes(event))loadJournal(session.user);return}if(event==='SIGNED_OUT')deactivateAccount()},0)});
}
function deactivateAccount(){if(syncTimer){clearTimeout(syncTimer);syncTimer=null}authUser=null;syncVersion=0;savedVersion=0;clearLegacyAfterSync=false;resetJournal();showAuthGate();$('#authForm').reset();$('#authForm').hidden=false;$('#authLinks').hidden=false;$('#authSetup').hidden=true;showAuthMode('login')}
$('#authForm').addEventListener('submit',async event=>{event.preventDefault();const button=$('#authSubmit');button.disabled=true;$('#authError').textContent='';

  if(authMode==='update-password'){const{error}=await supabaseClient.auth.updateUser({password});if(error)throw error;showAuthMode('login');const{data,error:getError}=await supabaseClient.auth.getSession();if(getError)throw getError;if(data.session)await loadJournal(data.session.user);return}
  const{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error
 }catch(error){$('#authError').textContent=error.message||String(error)}finally{button.disabled=false}});

// ---- stats
function st(L){const n=L.length,w=L.filter(t=>t.net>0),l=L.filter(t=>t.net<0),sm=a=>a.reduce((s,t)=>s+t.net,0),gp=sm(w),gl=Math.abs(sm(l));
 let eq=0,pk=0,dd=0,cw=0,cL=0,mw=0,ml=0;[...L].sort(cmp).forEach(t=>{eq+=t.net;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq);if(t.net>0){cw++;cL=0}else if(t.net<0){cL++;cw=0}else{cw=cL=0}mw=Math.max(mw,cw);ml=Math.max(ml,cL)});
 const rr=L.map(t=>parseFloat((t.rr||'').split(':')[1])).filter(Boolean),nets=L.map(t=>t.net);
 return{n,w:w.length,l:l.length,b:n-w.length-l.length,net:sm(L),wr:n?w.length/n*100:0,pf:gl?gp/gl:gp?Infinity:0,dd,aw:w.length?gp/w.length:0,al:l.length?-gl/l.length:0,
  rr:rr.length?rr.reduce((a,b)=>a+b)/rr.length:0,ex:n?sm(L)/n:0,fees:L.reduce((s,t)=>s+num(t.fee),0),best:n?Math.max(...nets):0,worst:n?Math.min(...nets):0,mw,ml}}

const tip=(e,h)=>{const t=$('#tip');t.innerHTML=h;t.hidden=false;t.style.left=Math.min(e.clientX+14,innerWidth-t.offsetWidth-8)+'px';t.style.top=(e.clientY+14)+'px'};
function chart(id,o){const cv=$('#'+id);if(!cv)return;const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight,n=o.v.length;if(!w||!n)return;
 cv.width=w*r;cv.height=h*r;const x=cv.getContext('2d'),G=getComputedStyle(R),V=k=>G.getPropertyValue(k).trim(),L0=48,R0=8,T0=10,B0=22;
 let mn=Math.min(0,...o.v),mx=Math.max(0,...o.v);if(o.line){mn=Math.min(...o.v);mx=Math.max(...o.v);const p=(mx-mn)*.1||1;mn-=p;mx+=p}if(mn===mx)mx=mn+1;
 const iw=w-L0-R0,ih=h-T0-B0,X=i=>o.line?L0+iw*(n>1?i/(n-1):.5):L0+iw*(i+.5)/n,Y=v=>T0+ih*(1-(v-mn)/(mx-mn));
 function draw(hi){x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);x.font="11px 'Geist Mono',monospace";x.textBaseline='middle';x.lineWidth=1;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);x.strokeStyle=V('--bd');x.beginPath();x.moveTo(L0,y);x.lineTo(w-R0,y);x.stroke();x.fillStyle=V('--mu');x.textAlign='right';x.fillText(kf(v),L0-8,y)}
  [0,(n-1)>>1,n-1].filter((a,b,c)=>c.indexOf(a)===b).forEach((i,j,a)=>{x.textAlign=i===0&&a.length>1?'left':i===n-1&&a.length>1?'right':'center';x.fillStyle=V('--mu');x.fillText(o.s[i]||'',i===0&&a.length>1?L0:i===n-1&&a.length>1?w-R0:X(i),h-8)});
  if(o.line){x.beginPath();o.v.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=V('--ac');x.lineWidth=2;x.lineJoin='round';x.stroke();
   x.lineTo(X(n-1),h-B0);x.lineTo(X(0),h-B0);x.fillStyle=V('--ac')+'1a';x.fill();
   if(hi>=0){x.strokeStyle=V('--bd');x.lineWidth=1;x.beginPath();x.moveTo(X(hi),T0);x.lineTo(X(hi),h-B0);x.stroke();x.fillStyle=V('--ac');x.beginPath();x.arc(X(hi),Y(o.v[hi]),4.5,0,7);x.fill()}}
  else{const bw=Math.min(30,iw/n*.7);x.strokeStyle=V('--mu');x.beginPath();x.moveTo(L0,Y(0));x.lineTo(w-R0,Y(0));x.stroke();
   o.v.forEach((v,i)=>{x.globalAlpha=hi<0||hi===i?1:.45;x.fillStyle=V(v>=0?'--g':'--r');const y0=Y(0),y1=Y(v);x.fillRect(X(i)-bw/2,Math.min(y0,y1),bw,Math.max(1.5,Math.abs(y1-y0)));x.globalAlpha=1})}}
 draw(-1);
 cv.onmousemove=e=>{const px=e.clientX-cv.getBoundingClientRect().left;let i=o.line?Math.round((px-L0)/iw*(n-1)):Math.floor((px-L0)/iw*n);i=Math.max(0,Math.min(n-1,i));draw(i);tip(e,`${esc(o.l[i])}<br><b>${m(o.v[i],o.sg)}</b>`)};
 cv.onmouseleave=()=>{draw(-1);$('#tip').hidden=true}}

fe.dir.addEventListener('change',()=>{delete fe.gross.dataset.manual;calc()});
function openTrade(id){fm.reset();delete fe.gross.dataset.manual;delete fe.cap.dataset.manual;curImg=null;$('#pv').hidden=true;editId=id||null;
 const t=id&&T.find(x=>x.id===id),names=S.map(s=>s.name);if(t&&t.strat&&!names.includes(t.strat))names.push(t.strat);
 fe.strat.innerHTML='<option value="">None</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
 if(t){for(const k in t)if(k!=='id'&&k!=='img'&&fe[k])fe[k].value=t[k];fe.gross.dataset.manual=1;fe.cap.dataset.manual=1;curImg=t.img||null;if(curImg){$('#pv').src=curImg;$('#pv').hidden=false}}else fe.date.value=td();
 $('#dt').textContent=t?'Edit trade':'New trade';$('#dDel').hidden=!t;calc();dlg.showModal()}
fm.addEventListener('submit',ev=>{ev.preventDefault();calc();const d=Object.fromEntries(new FormData(fm));delete d.shot;d.img=curImg;d.net=num(d.gross)-num(d.fee);d.id=editId||Date.now();
 if(editId)T=T.map(t=>t.id===editId?d:t);else T.push(d);persist();dlg.close();render()});
$('#dDel').onclick=()=>{if(confirm('Delete this trade?')){T=T.filter(t=>t.id!==editId);persist();dlg.close();render()}};
$('#shot').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);curImg=c.toDataURL('image/jpeg',.65);$('#pv').src=curImg;$('#pv').hidden=false};im.src=URL.createObjectURL(fl)};

// ---- strategy dialog
const sf=$('#sform'),se=sf.elements;
function openStrat(id){sf.reset();editS=id||null;const s=id&&S.find(x=>x.id===id);if(s){se.name.value=s.name;se.desc.value=s.desc||'';se.rules.value=s.rules||''}$('#sdt').textContent=s?'Edit strategy':'New strategy';$('#sDel').hidden=!s;sdlg.showModal()}
sf.addEventListener('submit',ev=>{ev.preventDefault();const d={name:se.name.value.trim(),desc:se.desc.value,rules:se.rules.value};
 if(editS){const old=S.find(x=>x.id===editS);if(old.name!==d.name)T.forEach(t=>{if(t.strat===old.name)t.strat=d.name});S=S.map(x=>x.id===editS?{...x,...d}:x)}else S.push({id:Date.now(),...d});persist();sdlg.close();render()});
$('#sDel').onclick=()=>{if(confirm('Delete this strategy? Trades keep its name.')){S=S.filter(x=>x.id!==editS);persist();sdlg.close();render()}};
render();showAuthMode('login');initAuth();

</script>
